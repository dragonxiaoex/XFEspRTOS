# XC200 产品差异配置，芯片由 inc/xf_project_config.h 中的 XF_USE_CHIP_ID 选择。

# 沿用当前实际构建的硬件参数：160 MHz CPU、16 MB Flash、Octal PSRAM。
CONFIG_ESPTOOLPY_FLASHFREQ_120M=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_IDF_EXPERIMENTAL_FEATURES=y
CONFIG_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_120M=y

# LCD 缓冲与 LVGL，使用 inc/lv_conf.h。
CONFIG_LCD_RGB_BUFFER_NUMS=2
CONFIG_DISPLAY_LVGL_AVOID_TEAR=y
CONFIG_DISPLAY_LVGL_DIRECT_MODE=y
CONFIG_LV_CONF_SKIP=n

# 产品运行与文件系统设置。
CONFIG_PM_SLEEP_FUNC_IN_IRAM=y
CONFIG_ESP_INT_WDT_TIMEOUT_MS=300
CONFIG_FATFS_LFN_NONE=y
CONFIG_FATFS_USE_DYN_BUFFERS=n

# 保留当前固件的 TLS 与配网设置。
CONFIG_MBEDTLS_THREADING_C=n
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=y
CONFIG_MBEDTLS_LARGE_KEY_SOFTWARE_MPI=n
CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_0=y
CONFIG_ESP_PROTOCOMM_SUPPORT_SECURITY_VERSION_1=y

# menuconfig 保存的产品差异。
CONFIG_PARTITION_TABLE_CUSTOM=y
CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="config/esp32s3.csv"

# menuconfig 保存的产品差异。
CONFIG_ESP_WIFI_NVS_ENABLED=n

# menuconfig 保存的产品差异。
CONFIG_USE_BOUNCE_BUFFER=y
