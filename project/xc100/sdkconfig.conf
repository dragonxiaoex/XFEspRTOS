# XC100 产品差异配置，芯片由 inc/xf_project_config.h 中的 XF_USE_CHIP_ID 选择。

# 官方 ESP32-P4-Function-EV-Board：16 MB Flash，使用 3.0 之前的 P4 芯片系列。
# P4X 开发板使用不同修订系列，不能直接沿用此配置。
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y
CONFIG_ESP32P4_REV_MIN_0=y

# Hello World 同时输出到 UART0 和 USB Serial/JTAG，覆盖 v1.4 / v1.5.2 的调试接口。
CONFIG_ESP_CONSOLE_UART_DEFAULT=y
CONFIG_ESP_CONSOLE_UART_BAUDRATE=115200
CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=y
